    <text x="70" y="136" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#334155">hook</text>
  </g>

  <g transform="translate(314 244)">
    <rect x="0" y="-24" width="132" height="34" rx="17" fill="#DCFCE7"/>
    <circle cx="20" cy="-7" r="5" fill="#22C55E"/>
    <text x="36" y="-1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#166534">sshfs files</text>
  </g>
  <g transform="translate(514 244)">
    <rect x="0" y="-24" width="160" height="34" rx="17" fill="#EDE9FE"/>
    <circle cx="20" cy="-7" r="5" fill="#7C3AED"/>
    <text x="36" y="-1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#5B21B6">ssh exec route</text>
  </g>

  <text x="480" y="68" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="900" fill="#0F172A">Rah</text>
  <text x="480" y="91" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#475569">Remote as Host</text>
</svg>
